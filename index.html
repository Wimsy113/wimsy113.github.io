<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krystyna Ewing</title>
<style>
  html,body{margin:0;height:100%;background:#0d0c0c;overflow:hidden}
  #stage{position:relative;width:100%;height:100dvh;height:100vh}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #scene{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,1100px);height:min(82vh,760px);border:0;display:block}
  #skip{position:fixed;right:16px;bottom:16px;z-index:5;font:700 12px/1 'Space Mono',monospace,system-ui;letter-spacing:.06em;text-transform:uppercase;color:#ece6dc;background:rgba(13,12,12,.72);border:1px solid #ece6dc;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
  #skip:hover{background:#f45b8e;border-color:#f45b8e;color:#0d0c0c}
  :focus-visible{outline:3px solid #f45b8e;outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="images/cicada-hero-skull.webp" alt="Krystyna Ewing, lettered over a close-up skull painting">
  <iframe id="scene" src="https://my.spline.design/cicadaheroanimation-3yxmYtB4cOjRVghpm8UHp6FJ/" frameborder="0" title="Interactive cicada animation — click or drag to explore, then enter the site"></iframe>
</div>
<a id="skip" href="home.html">Skip intro →</a>
<script>
(function () {
  var iframe = document.getElementById('scene');
  var entered = false;
  function enterSite() {
    if (entered) return;
    entered = true;
    setTimeout(function () { window.location.href = 'home.html'; }, 9000);
  }
  // Clicking inside a cross-origin iframe doesn't fire a normal 'click' on
  // this document -- the reliable signal is that focus moves to the iframe
  // element itself, which happens the instant the user interacts with it.
  window.addEventListener('blur', function () {
    setTimeout(function () {
      if (document.activeElement === iframe) enterSite();
    }, 0);
  });
})();
</script>
</body>
</html>
