<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krystyna Ewing</title>
<script type="module" src="https://cdn.spline.design/@splinetool/viewer@2.0.75/build/spline-viewer.webgpu.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0d0c0c;overflow:hidden}
  #stage{position:relative;width:100%;height:100dvh;height:100vh;opacity:1;transition:opacity 1.1s ease}
  body.leaving #stage{opacity:0}
  body.leaving #skip{opacity:0;pointer-events:none}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #scene{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  #skip{position:fixed;right:16px;bottom:16px;z-index:5;font:700 12px/1 'Space Mono',monospace,system-ui;letter-spacing:.06em;text-transform:uppercase;color:#ece6dc;background:rgba(13,12,12,.72);border:1px solid #ece6dc;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;transition:opacity .4s ease}
  #skip:hover{background:#f45b8e;border-color:#f45b8e;color:#0d0c0c}
  :focus-visible{outline:3px solid #f45b8e;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){#stage,#skip{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="images/cicada-hero-skull.webp" alt="Krystyna Ewing, lettered over a close-up skull painting">
  <spline-viewer id="scene" url="https://prod.spline.design/v1OoKckRsrBF7-zg/scene.splinecode" aria-label="Interactive cicada animation — click or drag to explore, then enter the site"></spline-viewer>
</div>
<a id="skip" href="home.html">Skip intro →</a>
<script>
(function () {
  var scene = document.getElementById('scene');
  var entered = false, going = false;
  function goHome() {
    if (going) return;
    going = true;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { window.location.href = 'home.html'; return; }
    document.body.classList.add('leaving');
    setTimeout(function () { window.location.href = 'home.html'; }, 1100);
  }
  function enterSite() {
    if (entered) return;
    entered = true;
    setTimeout(goHome, 6000);
  }
  // spline-viewer renders in this document (it's a web component, not a
  // cross-origin iframe), but its internal drag/orbit controls call
  // stopPropagation() on pointerdown so the page doesn't scroll/drag while
  // you orbit the scene -- that also stops a listener on the element itself
  // from ever seeing the event. Listening on document in the CAPTURE phase
  // runs before that stopPropagation() has a chance to fire, so it still
  // sees every real interaction. isTrusted filters out the viewer's own
  // internal pointer events (fired while it sets up those controls) from
  // genuine user input -- a flag the browser sets and no script can spoof.
  document.addEventListener('pointerdown', function (e) {
    if (e.isTrusted && scene.contains(e.target)) enterSite();
  }, true);
  // If the Spline scene itself is set up to signal when its reveal
  // animation has actually finished, skip the fixed 6s wait and go
  // straight there. Covers both ways a scene could signal it: a custom
  // event dispatched on the <spline-viewer> element (the normal path for
  // an embedded web component -- see Spline's addEventListener docs) and
  // window postMessage (what a cross-origin iframe embed would have to use
  // instead, since it can't dispatch DOM events out past that boundary).
  // Neither does anything unless the scene is actually configured, in
  // Spline's own editor, to send a "cicada:revealed" signal.
  scene.addEventListener('cicada:revealed', goHome);
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'cicada:revealed') goHome();
  });
})();
</script>
</body>
</html>
